<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S1 My courses</title>
<style>
:root {
  color-scheme: light dark;
  --c-bg: #fafafa;
  --c-surface: #ffffff;
  --c-surface-2: #f5f5f5;
  --c-well: #f4f4f4;
  --c-line: #e8e8e8;
  --c-line-2: #d4d4d4;
  --c-ink: #171717;
  --c-ink-2: #525252;
  --c-ink-3: #6b6b6b;
  --c-ink-4: #a3a3a3;
  --c-on-ink: #ffffff;
  --c-ink-hover: #333333;
  --c-skeleton: #e4e4e4;
  --c-page: #f2f2f2;
  --c-control: #e9e9e9;
  --c-control-hover: #dedede;
  --c-shadow: 0 0 0;
  --c-shadow-a: 0.12;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --c-bg: #0e0e0e;
    --c-surface: #161616;
    --c-surface-2: #212121;
    --c-well: #1d1d1d;
    --c-line: #2a2a2a;
    --c-line-2: #3d3d3d;
    --c-ink: #ededed;
    --c-ink-2: #b0b0b0;
    --c-ink-3: #a1a1a1;
    --c-ink-4: #6e6e6e;
    --c-on-ink: #111111;
    --c-ink-hover: #cfcfcf;
    --c-skeleton: #2c2c2c;
    --c-page: #0e0e0e;
    --c-control: #2e2e2e;
    --c-control-hover: #383838;
    --c-shadow-a: 0.5;
  }
}
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] {
  color-scheme: dark;
  --c-bg: #0e0e0e;
  --c-surface: #161616;
  --c-surface-2: #212121;
  --c-well: #1d1d1d;
  --c-line: #2a2a2a;
  --c-line-2: #3d3d3d;
  --c-ink: #ededed;
  --c-ink-2: #b0b0b0;
  --c-ink-3: #a1a1a1;
  --c-ink-4: #6e6e6e;
  --c-on-ink: #111111;
  --c-ink-hover: #cfcfcf;
  --c-skeleton: #2c2c2c;
  --c-page: #0e0e0e;
  --c-control: #2e2e2e;
  --c-control-hover: #383838;
  --c-shadow-a: 0.5;
}

:root {
  --bg: var(--c-bg);
  --panel: var(--c-surface);
  --hover: var(--c-surface-2);
  --subtle: var(--c-surface-2);
  --well: var(--c-well);
  --line: var(--c-line);
  --line-strong: var(--c-line-2);
  --text: var(--c-ink);
  --neutral-text: var(--c-ink-2);
  --muted: var(--c-ink-3);
  --faint: var(--c-ink-4);
  --on-accent: var(--c-on-ink);
  --accent-hover: var(--c-ink-hover);
  --skeleton: var(--c-skeleton);
  --page: var(--c-page);
  --control: var(--c-control);
  --control-hover: var(--c-control-hover);
  --focus: var(--c-ink);
  --shadow: rgb(var(--c-shadow) / var(--c-shadow-a));
}

:root {
  --sans: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-title: 22px;
  --fs-heading: 17px;
  --fs-body: 15px;
  --fs-label: 13px;
  --fs-micro: 11px;
  --lh-tight: 1.15;
  --lh-snug: 1.3;
  --lh-body: 1.45;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --tracking-tight: -0.02em;
  --tracking-micro: 0.06em;
  --s-1: 2px;  --s-2: 4px;  --s-3: 6px;  --s-4: 8px;  --s-5: 12px;
  --s-6: 16px;  --s-8: 24px; --s-9: 32px; --s-10: 40px;
  --gutter: var(--s-10);
  --stack: var(--s-8);
  --content-max: 1200px;
  --bar-height: 52px;
  --avatar-size: 36px;
  --avatar-small-size: 28px;
  --icon-size: 28px;
  --field-height: 120px;
  --form-max: 640px;
  --last-active-width: 170px;
  --r-control: 8px;
  --r-card: 12px;
  --r-pill: 999px;
  --e-1: 0 1px 2px rgb(var(--c-shadow) / calc(var(--c-shadow-a) * 0.35));
  --e-2: 0 2px 8px rgb(var(--c-shadow) / calc(var(--c-shadow-a) * 0.55));
  --motion: 140ms cubic-bezier(0.2, 0, 0, 1);
  --target: 32px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--sans);
  color: var(--text); background: var(--page);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--text); text-decoration-color: var(--line-strong); text-underline-offset: var(--s-1); }
:focus-visible { outline: var(--s-1) solid var(--focus); outline-offset: var(--s-1); border-radius: var(--s-2); }

.bar {
  display: flex; align-items: center; gap: var(--s-6);
  height: var(--bar-height);

  padding: 0 max(var(--gutter), calc((100% - var(--content-max)) / 2));
  background: var(--panel);
}
.bar .home { font-weight: var(--fw-semibold); text-decoration: none; }
.crumbs { display: flex; align-items: center; margin: 0; padding: 0; list-style: none; font-size: var(--fs-label); }
.crumbs li + li::before { content: "/"; color: var(--faint); margin: 0 var(--s-4); }
.crumbs a { color: var(--muted); text-decoration: none; transition: color var(--motion); }
.crumbs a:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--line-strong); }
.crumbs [aria-current="page"] { color: var(--text); font-weight: var(--fw-medium); }
.page {
  display: flex; flex-direction: column; gap: var(--stack);
  max-width: calc(var(--content-max) + 2 * var(--gutter));
  margin: 0 auto;
  padding: var(--s-9) var(--gutter) var(--s-10);
}
.page-head { display: flex; align-items: flex-end; gap: var(--s-4); }
.page-head .actions { margin-left: auto; display: flex; gap: var(--s-4); }
h1 {
  font-size: var(--fs-title); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-tight); line-height: var(--lh-tight);
}

.eyebrow {
  font-size: var(--fs-micro); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-micro); text-transform: uppercase;
  color: var(--muted);
}
.muted { color: var(--muted); font-size: var(--fs-label); line-height: var(--lh-snug); }

.grid { display: grid; gap: var(--s-6); grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-items: start; }
.grid.tight { gap: var(--s-4); }
.row { display: flex; justify-content: space-between; align-items: center; gap: var(--s-5); }

.summary { display: grid; grid-template-columns: 2fr 1fr; gap: var(--s-6); align-items: start; }
.last-active { width: var(--last-active-width); }
.flag { font-weight: var(--fw-semibold); color: var(--text); }

.card {
  background: var(--panel);
  border-radius: var(--r-card);
  padding: var(--s-5) var(--s-6);
  box-shadow: var(--e-1);
  display: flex; flex-direction: column; gap: var(--s-4);
}
.card > * { min-width: 0; }
.card h2 {
  font-size: var(--fs-heading); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-tight); line-height: var(--lh-snug);
}

.card.quiet { background: var(--well); box-shadow: none; border-radius: var(--r-control); }

.card.inline { flex-direction: row; align-items: center; justify-content: space-between; }

.board { display: flex; flex-direction: column; gap: var(--s-5); }
.board > h2 { font-size: var(--fs-heading); font-weight: var(--fw-semibold); letter-spacing: var(--tracking-tight); line-height: var(--lh-snug); }
.lane { display: flex; flex-direction: column; gap: var(--s-4); }
.lane h2, .lane h3 { font-size: var(--fs-label); font-weight: var(--fw-semibold); color: var(--neutral-text); padding: 0 var(--s-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-4);
  min-height: var(--target); align-self: flex-end;
  padding: var(--s-3) var(--s-6);
  border: 0; border-radius: var(--r-control);
  font-size: var(--fs-label); font-weight: var(--fw-medium);
  text-align: center; text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background var(--motion);
}
.btn.primary { background: var(--text); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--control); color: var(--text); }
.btn.secondary:hover { background: var(--control-hover); }

.avatar { display: block; flex: none; width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%; background: var(--skeleton); }
.avatar.sm { width: var(--avatar-small-size); height: var(--avatar-small-size); }
.icon { display: block; flex: none; width: var(--icon-size); height: var(--icon-size); border-radius: var(--s-3); background: var(--skeleton); }
.bar .avatar { margin-left: auto; }

.list > li { display: flex; align-items: center; gap: var(--s-5); padding: var(--s-4) 0; }
.list > li:first-child { padding-top: 0; }
.list > li:last-child { padding-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }

.card.task { position: relative; transition: box-shadow var(--motion); }
.card.task:has(.stretch:hover) { box-shadow: var(--e-2); }
.stretch { color: inherit; text-decoration: none; }
.stretch::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.card.task .btn { position: relative; z-index: 1; }

.field { display: flex; flex-direction: column; gap: var(--s-3); }
.field > label, .field > .label {
  font-size: var(--fs-micro); font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-micro); text-transform: uppercase;
  color: var(--muted);
}
input, textarea {
  width: 100%; min-height: var(--target);
  padding: var(--s-4) var(--s-5);
  border: 0; border-radius: var(--r-control);
  background: var(--subtle); font: inherit; color: inherit;
}
textarea { min-height: var(--field-height); resize: vertical; }

.buttons { display: flex; justify-content: flex-end; gap: var(--s-4); }
.buttons .btn { align-self: auto; }

.page.narrow > * { max-width: var(--form-max); }

.sk { display: block; height: var(--s-4); border-radius: var(--r-pill); background: var(--skeleton); width: var(--w, 100%); }
.sk + .sk { margin-top: var(--s-3); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: var(--s-4) var(--s-6); }
thead th { padding-top: var(--s-5); }
tbody tr:last-child td { padding-bottom: var(--s-5); }

tbody td { height: calc(var(--target) + 2 * var(--s-4)); }
td:last-child, th:last-child { text-align: right; }
.card.table { padding: 0; gap: 0; overflow: hidden; }
</style>

<script>
(() => {
  const screens = JSON.parse(document.getElementById("screens").textContent);
  const styles = document.getElementById("screen-styles");

  function showScreen() {
    const name = location.hash.slice(1);
    const screen = Object.hasOwn(screens, name)
      ? screens[name]
      : screens["S1-my-courses"];
    document.title = screen.title;
    styles.textContent = screen.styles;
    document.body.innerHTML = screen.body;
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", (event) => {
    if (event.target.closest('a[href="#"]')) event.preventDefault();
  });
  window.addEventListener("hashchange", showScreen);
  showScreen();
})();
